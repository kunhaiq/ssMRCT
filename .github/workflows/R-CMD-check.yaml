# Based on the standard r-lib/actions R package check workflow.
name: R-CMD-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release', manual: true}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::V8
            any::tinytex
          needs: check
      - name: Install HTML validator (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tidy
      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.manual == true
      - name: Install PDF manual fonts and tools
        if: matrix.config.manual == true
        shell: Rscript {0}
        run: |
          tinytex::tlmgr_install(c("inconsolata", "helvetic", "times", "courier",
                                  "fancyvrb", "texinfo"))
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.manual && '"--as-cran"' || 'c("--no-manual", "--as-cran")' }}
          build_args: ${{ matrix.config.manual && 'character()' || '"--no-manual"' }}
          error-on: '"warning"'
          upload-results: true
